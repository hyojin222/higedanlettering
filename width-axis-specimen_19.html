<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Width Axis — Type Specimen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flubber/0.4.2/flubber.min.js"></script>
<style>
  :root{
    --paper:#F5F3EE;
    --ink:#161512;
    --rule:#B23A2E;
    --anchor:#C0392B;
    --ctrl:#2E8B57;
    --hair:rgba(22,21,18,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
    font-family: ui-monospace, "SF Mono", "Courier New", monospace;
    overflow:hidden;}
  .stage{ position:relative; width:100%; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; }

  .tabs{ position:absolute; top:28px; left:50%; transform:translateX(-50%); display:flex; gap:2px;
    z-index:20; }
  .tab-btn{ font-family:inherit; font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
    background:var(--paper); border:1px solid var(--hair); color:var(--ink); opacity:0.45;
    padding:7px 16px; cursor:pointer; }
  .tab-btn.active{ opacity:1; border-color:var(--ink); }

  .panel{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:1; }
  .panel[hidden]{ display:none; }

  .frame{ position:absolute; inset:0; pointer-events:none; z-index:1; }
  .corner-label{ position:absolute; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink); opacity:0.55; }
  .tl{top:28px; left:32px;}
  .tr{top:28px; right:32px; text-align:right;}
  .bl{bottom:28px; left:32px;}
  .br{bottom:28px; right:32px; text-align:right;}
  .bc{bottom:28px; left:50%; transform:translateX(-50%); text-align:center;}

  .glyph-wrap{ height:min(38vh, 380px); cursor:pointer; position:relative; z-index:2;
    -webkit-tap-highlight-color: transparent; user-select:none; }
  svg#glyph{ height:100%; width:auto; max-width:92vw; display:block; overflow:visible; }
  svg#glyph rect, svg#glyph path{ fill:var(--ink); }
  svg#glyph .cls-1{ fill:var(--paper); }

  .label-pair{ display:flex; gap:10px; align-items:center; }
  .label-pair span{ transition: opacity .3s ease, font-weight .3s ease; opacity:0.35; }
  .label-pair span.on{ opacity:1; }
  .dot{ width:4px; height:4px; border-radius:50%; background:var(--rule); display:inline-block; margin:0 2px; }

  #debugToggle{ position:absolute; top:28px; left:32px;
    font-family:inherit; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    background:none; border:1px solid var(--hair); color:var(--ink); opacity:0.5;
    padding:5px 10px; cursor:pointer; pointer-events:auto; z-index:5; }
  #debugToggle:hover{ opacity:0.9; }
  #debugPanel{ position:absolute; top:64px; left:32px;
    width:min(35vw, 260px); display:none; pointer-events:auto; z-index:5; }
  #debugPanel.on{ display:block; }
  #debugPanel input[type=range]{ width:100%; }
  svg#glyph.debug rect, svg#glyph.debug path{ stroke:var(--rule); stroke-width:0.2; fill-opacity:0.55; }
  .idx-label{ font-size:3px; fill:var(--rule) !important; stroke:none !important;
    font-family: ui-monospace, monospace; pointer-events:none; }
  .anchor-dot{ fill:var(--anchor) !important; stroke:none !important; }
  .ctrl-dot{ fill:var(--ctrl) !important; stroke:none !important; }
  .curv-label{ font-size:2.6px; fill:var(--anchor) !important; stroke:none !important;
    font-family: ui-monospace, monospace; pointer-events:none; }

  .mix-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px;
    cursor:pointer; position:relative; z-index:2;
    -webkit-tap-highlight-color:transparent; user-select:none; }
  svg#mixGlyph{ display:block; }
  svg#mixGlyph rect, svg#mixGlyph path{ fill:var(--ink); }
  svg#mixGlyph .cls-1{ fill:var(--paper); }
  svg#posGlyph{ display:block; overflow:visible; }
  svg#posGlyph rect, svg#posGlyph path{ fill:var(--ink); }
  svg#posGlyph .cls-1{ fill:var(--paper); }

  .color-controls{ position:absolute; display:flex; align-items:center; gap:6px;
    pointer-events:auto; z-index:5; }
  .color-controls input[type=color]{ width:22px; height:22px; border:1px solid var(--hair);
    padding:0; background:none; cursor:pointer; border-radius:3px; }
  .color-controls button{ font-family:inherit; font-size:13px; background:none;
    border:1px solid var(--hair); color:var(--ink); opacity:0.6; padding:3px 8px;
    cursor:pointer; border-radius:3px; line-height:1.4; }
  .color-controls button:hover{ opacity:1; }
  .default-btn{ position:absolute; bottom:28px; left:32px; font-family:inherit; font-size:10px;
    letter-spacing:0.1em; text-transform:uppercase; background:none; border:1px solid var(--hair);
    color:var(--ink); opacity:0.5; padding:5px 10px; cursor:pointer; pointer-events:auto; z-index:5; }
  .default-btn:hover{ opacity:0.9; }

  .song-picker{ position:fixed; top:28px; right:32px;
    display:flex; flex-direction:column; align-items:flex-end; gap:4px; z-index:30; pointer-events:auto; }
  .song-picker-title{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    opacity:0.45; margin-bottom:14px; }
  .song-btn{ font-family:inherit; font-size:12px; letter-spacing:0.02em;
    background:none; border:none; color:var(--ink); opacity:0.5;
    padding:2px 0; cursor:pointer; text-align:right;
    transform:scale(1); transform-origin:right center;
    transition:opacity .2s ease, transform .2s ease, color .2s ease; }
  .song-btn:hover{ opacity:0.85; color:var(--rule); transform:scale(1.12); }
  .song-btn.playing{ opacity:1; color:var(--rule); transform:scale(1.12); font-weight:600; }

  .audio-reactive-toggle{ position:absolute; top:28px; left:32px;
    font-family:inherit; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    background:none; border:1px solid var(--hair); color:var(--ink); opacity:0.5;
    padding:5px 10px; cursor:pointer; pointer-events:auto; z-index:5; }
  .audio-reactive-toggle:hover{ opacity:0.9; }
  .audio-reactive-toggle.on{ opacity:1; border-color:var(--rule); color:var(--rule); }
</style>
</head>
<body>

<!-- YouTube player, pinned to the very back of the page -->
<div id="ytPlayerHost" style="position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;">
  <iframe id="ytFrame" width="200" height="113"
    src="" title="background music" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
</div>

<div class="song-picker" id="songPicker">
  <div class="song-picker-title">Music List</div>
  <button class="song-btn" data-idx="0">Pretender</button>
  <button class="song-btn" data-idx="1">Cry Baby</button>
  <button class="song-btn" data-idx="2">Mixed Nuts</button>
</div>

<div class="stage" id="stage">
  <div class="tabs">
    <button class="tab-btn active" data-tab="morph">Morph</button>
    <button class="tab-btn" data-tab="mix">Random Mix</button>
    <button class="tab-btn" data-tab="pos">Random Position</button>
  </div>

  <div class="panel" id="panel-morph">
    <div class="frame">
      <!-- <div class="corner-label tl">AXIS — WIDTH</div> -->
      <div class="corner-label bc">CLICK &amp; HOLD TO STRETCH</div>
      <button id="debugToggle">Debug: off</button>
      <div id="debugPanel"><input type="range" id="debugSlider" min="0" max="1000" value="0"></div>
      <button class="default-btn defaultColorsBtn">Default</button>
      <div class="color-controls br">
        <input type="color" class="bgColorInput" value="#f5f3ee" title="Background color">
        <input type="color" class="inkColorInput" value="#161512" title="Glyph color">
        <button class="randomColorsBtn" title="Randomize colors">🎲</button>
      </div>
    </div>
    <div class="glyph-wrap" id="glyphWrap">
      <svg id="glyph" viewBox="0 0 185.73 99.28" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="panel" id="panel-mix" hidden>
    <div class="frame">
      <!-- <div class="corner-label tl">PER-LETTER RANDOM WIDTH</div> -->
      <div class="corner-label bc">CLICK TO RESHUFFLE</div>
      <button class="audio-reactive-toggle" id="audioToggleMix">🎧 Audio: off</button>
      <button class="default-btn defaultColorsBtn">Default</button>
      <div class="color-controls br">
        <input type="color" class="bgColorInput" value="#f5f3ee" title="Background color">
        <input type="color" class="inkColorInput" value="#161512" title="Glyph color">
        <button class="randomColorsBtn" title="Randomize colors">🎲</button>
        <button id="randomPerLetterBtn" title="Random color per letter">🌈</button>
      </div>
    </div>
    <div class="mix-wrap" id="mixWrap">
      <svg id="mixGlyph" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="panel" id="panel-pos" hidden>
    <div class="frame">
      <div class="corner-label bc">CLICK TO RESHUFFLE</div>
      <button class="audio-reactive-toggle" id="audioTogglePos">🎧 Audio: off</button>
      <button class="default-btn defaultColorsBtn">Default</button>
      <div class="color-controls br">
        <input type="color" class="bgColorInput" value="#f5f3ee" title="Background color">
        <input type="color" class="inkColorInput" value="#161512" title="Glyph color">
        <button class="randomColorsBtn" title="Randomize colors">🎲</button>
      </div>
    </div>
    <div class="mix-wrap" id="posWrap">
      <svg id="posGlyph" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

/* ---------------- shared color controls (both tabs) ---------------- */
(function(){
  function randomHex(){
    return '#' + Math.floor(Math.random()*0xFFFFFF).toString(16).padStart(6,'0');
  }
  function setBg(color){
    document.documentElement.style.setProperty('--paper', color);
    document.querySelectorAll('.bgColorInput').forEach(el => el.value = color);
  }
  function setInk(color){
    document.documentElement.style.setProperty('--ink', color);
    document.querySelectorAll('.inkColorInput').forEach(el => el.value = color);
  }
  function clearPerLetterColors(){
    document.querySelectorAll('#mixGlyph > g').forEach(g => g.style.removeProperty('--ink'));
  }

  document.querySelectorAll('.bgColorInput').forEach(el => {
    el.addEventListener('input', e => setBg(e.target.value));
  });
  document.querySelectorAll('.inkColorInput').forEach(el => {
    el.addEventListener('input', e => { setInk(e.target.value); clearPerLetterColors(); });
  });
  document.querySelectorAll('.randomColorsBtn').forEach(btn => {
    btn.addEventListener('click', () => { setBg(randomHex()); setInk(randomHex()); clearPerLetterColors(); });
  });
  document.getElementById('randomPerLetterBtn').addEventListener('click', () => {
    setBg(randomHex());
    document.querySelectorAll('#mixGlyph > g').forEach(g => g.style.setProperty('--ink', randomHex()));
  });
  document.querySelectorAll('.defaultColorsBtn').forEach(btn => {
    btn.addEventListener('click', () => { setBg('#f5f3ee'); setInk('#161512'); clearPerLetterColors(); });
  });
})();

/* ==================================================================
   Hybrid approach: WE compute the best starting-point/direction
   alignment between the two shapes ourselves (this is the part a
   library like Flubber tends to get wrong on its own for elongated
   or open bracket-like shapes, which is what caused the earlier
   pinching/splitting). Once pre-aligned, Flubber is used to do the
   actual shape interpolation. Rest states (t=0/1) always return the
   exact original 'd' string untouched.
   ================================================================== */
function lerp(a,b,t){ return a + (b-a)*t; }
const CMD_RE = /([MLHVCSQTAZmlhvcsqtaz])([^MLHVCSQTAZmlhvcsqtaz]*)/g;
const NUM_RE = /-?\d*\.?\d+(?:[eE][-+]?\d+)?/g;

function extractSegments(d){
  let m, cx=0, cy=0, startX=0, startY=0, start=null;
  let prevCubicC2 = null;  // for S reflection
  let prevQuadCtrl = null; // for T reflection
  const segs = [];
  CMD_RE.lastIndex = 0;
  function pushLine(ex,ey){
    const c1=[cx+(ex-cx)/3, cy+(ey-cy)/3];
    const c2=[cx+(ex-cx)*2/3, cy+(ey-cy)*2/3];
    segs.push({c1,c2,end:[ex,ey]});
    cx=ex; cy=ey;
    prevCubicC2 = null; prevQuadCtrl = null;
  }
  function pushCubic(c1,c2,end){
    segs.push({c1,c2,end});
    cx=end[0]; cy=end[1];
    prevCubicC2 = c2; prevQuadCtrl = null;
  }
  function pushQuad(qc,end){
    // elevate quadratic to an equivalent cubic
    const c1=[cx+2/3*(qc[0]-cx), cy+2/3*(qc[1]-cy)];
    const c2=[end[0]+2/3*(qc[0]-end[0]), end[1]+2/3*(qc[1]-end[1])];
    segs.push({c1,c2,end});
    cx=end[0]; cy=end[1];
    prevQuadCtrl = qc; prevCubicC2 = null;
  }
  while ((m = CMD_RE.exec(d))) {
    const cmd = m[1];
    const nums = (m[2].match(NUM_RE) || []).map(Number);
    const upper = cmd.toUpperCase();
    const rel = cmd !== upper;
    if (upper === 'M'){
      cx = rel?cx+nums[0]:nums[0]; cy = rel?cy+nums[1]:nums[1];
      startX=cx; startY=cy; start=[cx,cy];
      prevCubicC2 = null; prevQuadCtrl = null;
      for (let i=2;i<nums.length;i+=2){
        const ex = rel?cx+nums[i]:nums[i], ey = rel?cy+nums[i+1]:nums[i+1];
        pushLine(ex,ey);
      }
    } else if (upper === 'L'){
      for (let i=0;i<nums.length;i+=2){
        const ex = rel?cx+nums[i]:nums[i], ey = rel?cy+nums[i+1]:nums[i+1];
        pushLine(ex,ey);
      }
    } else if (upper === 'H'){
      for (let i=0;i<nums.length;i++){ const ex = rel?cx+nums[i]:nums[i]; pushLine(ex,cy); }
    } else if (upper === 'V'){
      for (let i=0;i<nums.length;i++){ const ey = rel?cy+nums[i]:nums[i]; pushLine(cx,ey); }
    } else if (upper === 'C'){
      for (let i=0;i<nums.length;i+=6){
        const c1=[rel?cx+nums[i]:nums[i], rel?cy+nums[i+1]:nums[i+1]];
        const c2=[rel?cx+nums[i+2]:nums[i+2], rel?cy+nums[i+3]:nums[i+3]];
        const end=[rel?cx+nums[i+4]:nums[i+4], rel?cy+nums[i+5]:nums[i+5]];
        pushCubic(c1,c2,end);
      }
    } else if (upper === 'S'){
      for (let i=0;i<nums.length;i+=4){
        const c1 = prevCubicC2 ? [2*cx-prevCubicC2[0], 2*cy-prevCubicC2[1]] : [cx,cy];
        const c2=[rel?cx+nums[i]:nums[i], rel?cy+nums[i+1]:nums[i+1]];
        const end=[rel?cx+nums[i+2]:nums[i+2], rel?cy+nums[i+3]:nums[i+3]];
        pushCubic(c1,c2,end);
      }
    } else if (upper === 'Q'){
      for (let i=0;i<nums.length;i+=4){
        const qc=[rel?cx+nums[i]:nums[i], rel?cy+nums[i+1]:nums[i+1]];
        const end=[rel?cx+nums[i+2]:nums[i+2], rel?cy+nums[i+3]:nums[i+3]];
        pushQuad(qc,end);
      }
    } else if (upper === 'T'){
      for (let i=0;i<nums.length;i+=2){
        const qc = prevQuadCtrl ? [2*cx-prevQuadCtrl[0], 2*cy-prevQuadCtrl[1]] : [cx,cy];
        const end=[rel?cx+nums[i]:nums[i], rel?cy+nums[i+1]:nums[i+1]];
        pushQuad(qc,end);
      }
    } else if (upper === 'Z'){
      if (Math.abs(cx-startX) > 1e-6 || Math.abs(cy-startY) > 1e-6) pushLine(startX, startY);
      cx = startX; cy = startY;
      prevCubicC2 = null; prevQuadCtrl = null;
    }
  }
  return { start, segs };
}

function padSegs(segs, N){
  if (segs.length === N) return segs;
  const out = [];
  for (let i=0;i<N;i++){
    const idx = Math.round(i * (segs.length-1) / (N-1));
    out.push(segs[idx]);
  }
  return out;
}

function shiftSegs(start, segs, shift){
  if (shift === 0) return { start, segs };
  const pts = [start, ...segs.map(s=>s.end)];
  const newStart = pts[shift];
  const newSegs = segs.slice(shift).concat(segs.slice(0, shift));
  return { start: newStart, segs: newSegs };
}

function reverseSegs(start, segs){
  const pts = [start, ...segs.map(s=>s.end)];
  const N = segs.length;
  const newStart = pts[N];
  const newSegs = [];
  for (let k=N-1;k>=0;k--){
    newSegs.push({ c1: segs[k].c2, c2: segs[k].c1, end: pts[k] });
  }
  return { start: newStart, segs: newSegs };
}

function dropRedundantClosingSegment(obj){
  // if the last segment is a near-zero-length hop (its start ~= its end,
  // i.e. the path was already visually closed one point earlier), drop it.
  // Otherwise this "almost duplicate" point throws off the rotation search:
  // it looks like one point but is really two very close ones, and after
  // alignment the two can end up mapped to two DIFFERENT far-apart points,
  // making it look like a brand new point is born mid-morph.
  const { start, segs } = obj;
  if (segs.length < 2) return obj;
  const last = segs[segs.length-1];
  const prevEnd = segs[segs.length-2].end;
  const segLen = Math.hypot(last.end[0]-prevEnd[0], last.end[1]-prevEnd[1]);
  const xs = [start[0], ...segs.map(s=>s.end[0])];
  const ys = [start[1], ...segs.map(s=>s.end[1])];
  const scale = Math.max(Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys));
  if (scale > 0 && segLen/scale < 0.02) {
    return { start, segs: segs.slice(0, -1) };
  }
  return obj;
}

function bestAlignSegs(startA, segsA, startB, segsB){
  const N = segsA.length;
  const endsA = segsA.map(s=>s.end);
  let best = { cost: Infinity, shift: 0, rev: false };
  for (const rev of [false, true]){
    const cand = rev ? reverseSegs(startB, segsB) : { start:startB, segs:segsB };
    for (let shift=0; shift<N; shift++){
      const shifted = shiftSegs(cand.start, cand.segs, shift);
      let cost = 0;
      for (let i=0;i<N;i++){
        const dx = endsA[i][0]-shifted.segs[i].end[0], dy = endsA[i][1]-shifted.segs[i].end[1];
        cost += dx*dx+dy*dy;
      }
      if (cost < best.cost) best = { cost, shift, rev };
    }
  }
  const cand = best.rev ? reverseSegs(startB, segsB) : { start:startB, segs:segsB };
  return shiftSegs(cand.start, cand.segs, best.shift);
}

function serializeSegs(start, segs){
  let out = `M${start[0].toFixed(3)},${start[1].toFixed(3)} `;
  segs.forEach(s => {
    out += `C${s.c1[0].toFixed(3)},${s.c1[1].toFixed(3)} ${s.c2[0].toFixed(3)},${s.c2[1].toFixed(3)} ${s.end[0].toFixed(3)},${s.end[1].toFixed(3)} `;
  });
  return out + 'Z';
}

function makeTween(da, db){
  const rawA = extractSegments(da);
  const rawB = extractSegments(db);
  const A = dropRedundantClosingSegment(rawA);
  const B = dropRedundantClosingSegment(rawB);
  const exact = (A.segs.length === B.segs.length);

  if (!exact) {
    // mismatched anchor-point counts: our own proportional-duplication
    // padding can pick a locally-bad correspondence for these (verified
    // against this exact dataset). Flubber's own resampling handles
    // differing topology more gracefully here, so fall back to it only
    // for this harder case.
    const flub = flubber.interpolate(da, db, { maxSegmentLength: 1.5 });
    function fn(t){
      if (t <= 0) return da;
      if (t >= 1) return db;
      return flub(t);
    }
    function pointsAt(t){ return extractSegments(fn(t)); }
    return { fn, pointsAt, exact };
  }

  // exact same anchor-point count: interpolate the real control points
  // directly -- provably exact curvature, no library needed.
  const N = A.segs.length;
  const aligned = bestAlignSegs(A.start, A.segs, B.start, B.segs);
  const startA = A.start, startB = aligned.start, segsA = A.segs, segsB = aligned.segs;

  function pointsAt(t){
    if (t <= 0) return { start: rawA.start, segs: rawA.segs };   // true original, unpadded, untrimmed
    if (t >= 1) return { start: rawB.start, segs: rawB.segs };   // true original, unpadded, untrimmed
    const start = [lerp(startA[0],startB[0],t), lerp(startA[1],startB[1],t)];
    const segs = segsA.map((a,i)=>{
      const b = segsB[i];
      return {
        c1: [lerp(a.c1[0],b.c1[0],t), lerp(a.c1[1],b.c1[1],t)],
        c2: [lerp(a.c2[0],b.c2[0],t), lerp(a.c2[1],b.c2[1],t)],
        end: [lerp(a.end[0],b.end[0],t), lerp(a.end[1],b.end[1],t)],
      };
    });
    return { start, segs };
  }
  function fn(t){
    if (t <= 0) return da;
    if (t >= 1) return db;
    const { start, segs } = pointsAt(t);
    return serializeSegs(start, segs);
  }
  return { fn, pointsAt, exact };
}


function cubicCurvatureAtStart(p0, c1, c2){
  const d1x = 3*(c1[0]-p0[0]), d1y = 3*(c1[1]-p0[1]);
  const d2x = 6*(c2[0]-2*c1[0]+p0[0]), d2y = 6*(c2[1]-2*c1[1]+p0[1]);
  const num = d1x*d2y - d1y*d2x;
  const den = Math.pow(d1x*d1x + d1y*d1y, 1.5);
  return den > 1e-6 ? num/den : 0;
}

/* ---------------- TAB 1: whole-word morph (click & hold) ---------------- */
(function(){
  const svg = document.getElementById('glyph');
  const rectShapes = DATA.allShapes.filter(s => s.kind === 'rect');
  const curveShapes = DATA.allShapes.filter(s => s.kind === 'curve');

  const rectEls = rectShapes.map(r => {
    const el = document.createElementNS(NS, 'rect');
    if (r.fill === 'cls-1') el.setAttribute('class','cls-1');
    svg.appendChild(el);
    return el;
  });
  const rectLabels = rectShapes.map((r,i) => {
    const t = document.createElementNS(NS,'text'); t.setAttribute('class','idx-label');
    t.textContent = 'r'+i; t.style.display='none'; svg.appendChild(t); return t;
  });

  const curveEls = [];
  const curveLabels = [];
  const debugGroups = [];
  const tweens = curveShapes.map((p,i) => {
    const el = document.createElementNS(NS, 'path');
    if (p.fill === 'cls-1') el.setAttribute('class','cls-1');
    svg.appendChild(el);
    curveEls.push(el);
    const t = document.createElementNS(NS,'text'); t.setAttribute('class','idx-label');
    t.textContent = 'p'+i; t.style.display='none'; svg.appendChild(t);
    curveLabels.push(t);
    const dbgG = document.createElementNS(NS,'g');
    dbgG.style.display = 'none';
    svg.appendChild(dbgG);
    debugGroups.push(dbgG);
    return makeTween(p.a.d, p.b.d);
  });

  let debugOn = false;
  const R_ANCHOR = 0.5, R_CTRL = 0.35;

  function renderDebugMarkers(g, pts){
    while (g.firstChild) g.removeChild(g.firstChild);
    const { start, segs } = pts;
    let prev = start;
    // when Flubber is driving the mid-transition frame there can be 100+
    // points; skip labels (but keep dots) beyond a sane count to stay legible
    const showLabels = segs.length <= 40;
    segs.forEach(s => {
      [s.c1, s.c2].forEach(cp => {
        const c = document.createElementNS(NS,'circle');
        c.setAttribute('class','ctrl-dot');
        c.setAttribute('cx', cp[0]); c.setAttribute('cy', cp[1]); c.setAttribute('r', R_CTRL);
        g.appendChild(c);
      });
      const a = document.createElementNS(NS,'circle');
      a.setAttribute('class','anchor-dot');
      a.setAttribute('cx', prev[0]); a.setAttribute('cy', prev[1]); a.setAttribute('r', R_ANCHOR);
      g.appendChild(a);
      if (showLabels){
        const kappa = cubicCurvatureAtStart(prev, s.c1, s.c2);
        const label = document.createElementNS(NS,'text');
        label.setAttribute('class','curv-label');
        label.setAttribute('x', prev[0]+1.2); label.setAttribute('y', prev[1]-0.8);
        label.textContent = kappa.toFixed(2);
        g.appendChild(label);
      }
      prev = s.end;
    });
  }

  function render(t){
    const vb = [0,0, lerp(DATA.vbA[2],DATA.vbB[2],t), lerp(DATA.vbA[3],DATA.vbB[3],t)];
    svg.setAttribute('viewBox', vb.join(' '));

    rectShapes.forEach((r,i) => {
      const el = rectEls[i];
      const x = lerp(r.a.x, r.b.x, t), y = lerp(r.a.y, r.b.y, t);
      const w = lerp(r.a.w, r.b.w, t), h = lerp(r.a.h, r.b.h, t);
      el.setAttribute('x',x); el.setAttribute('y',y);
      el.setAttribute('width',w); el.setAttribute('height',h);
      if (debugOn){ rectLabels[i].setAttribute('x',x+w/2); rectLabels[i].setAttribute('y',y+h/2); }
    });

    tweens.forEach((tw,i) => {
      curveEls[i].setAttribute('d', tw.fn(t));
      if (debugOn){
        const bb = curveEls[i].getBBox();
        curveLabels[i].setAttribute('x', bb.x+bb.width/2);
        curveLabels[i].setAttribute('y', bb.y+bb.height/2);
        curveLabels[i].textContent = 'p'+i + (tw.exact ? '' : '*');
        renderDebugMarkers(debugGroups[i], tw.pointsAt(t));
      }
    });

  }
  render(0);

  let current=0, target=0, raf=null;
  function tick(){
    current += (target-current)*0.12;
    if (Math.abs(target-current) < 0.0008) current = target;
    render(current);
    raf = (current!==target) ? requestAnimationFrame(tick) : null;
  }
  function goTo(t){ target=t; if(!raf) raf=requestAnimationFrame(tick); }

  const wrap = document.getElementById('glyphWrap');
  let isPressed=false;
  function press(){ if(debugOn) return; goTo(1); }
  function release(){ if(debugOn) return; goTo(0); }
  wrap.addEventListener('mousedown', ()=>{ isPressed=true; press(); });
  window.addEventListener('mouseup', ()=>{ isPressed=false; release(); });
  wrap.addEventListener('mouseleave', ()=>{ if(!isPressed) release(); });
  wrap.addEventListener('touchstart', e=>{ e.preventDefault(); press(); }, {passive:false});
  wrap.addEventListener('touchend', release);
  wrap.addEventListener('touchcancel', release);

  const debugToggle = document.getElementById('debugToggle');
  const debugPanel = document.getElementById('debugPanel');
  const debugSlider = document.getElementById('debugSlider');
  debugToggle.addEventListener('click', () => {
    debugOn = !debugOn;
    debugToggle.textContent = 'Debug: ' + (debugOn?'on':'off');
    debugPanel.classList.toggle('on', debugOn);
    svg.classList.toggle('debug', debugOn);
    rectLabels.forEach(l=>l.style.display = debugOn?'block':'none');
    curveLabels.forEach(l=>l.style.display = debugOn?'block':'none');
    debugGroups.forEach(g=>g.style.display = debugOn?'block':'none');
    if (debugOn){
      if(raf) cancelAnimationFrame(raf); raf=null; target=current;
      debugSlider.value = Math.round(current*1000);
      render(current);
    }
  });
  debugSlider.addEventListener('input', () => {
    current = target = debugSlider.value/1000;
    render(current);
  });
})();

/* ---------------- TAB 2: random per-character mix, with morph transition ---------------- */
(function(){
  const svg = document.getElementById('mixGlyph');
  const K = 3.2; // px per unit

  const charIds = Object.keys(DATA.chars).map(Number);
  const currentT = {}, targetT = {};
  charIds.forEach(cid => { const v = Math.random()<0.5?0:1; currentT[cid]=v; targetT[cid]=v; });

  const charDom = {};
  DATA.rows.forEach(rowDef => {
    rowDef.charIds.forEach(cid => {
      const ch = DATA.chars[cid];
      const g = document.createElementNS(NS,'g');
      svg.appendChild(g);
      const shapeEls = ch.shapes.map(s => {
        let el;
        if (s.kind === 'rect'){ el = document.createElementNS(NS,'rect'); }
        else { el = document.createElementNS(NS,'path'); }
        if (s.fill === 'cls-1') el.setAttribute('class','cls-1');
        g.appendChild(el);
        const tween = s.kind === 'curve' ? makeTween(s.a.d, s.b.d) : null;
        return { el, kind: s.kind, s, tween };
      });
      charDom[cid] = { g, shapeEls };
    });
  });

  function renderFrame(){
    let maxWidth = 0;
    DATA.rows.forEach(rowDef => {
      let cursor = 0;
      rowDef.charIds.forEach((cid, idx) => {
        const ch = DATA.chars[cid];
        const t = currentT[cid];
        const w = lerp(ch.bboxA[2], ch.bboxB[2], t);
        const x0 = lerp(ch.bboxA[0], ch.bboxB[0], t);
        const dx = cursor - x0;
        const dom = charDom[cid];
        dom.g.setAttribute('transform', `translate(${dx},0)`);
        dom.shapeEls.forEach(({el, kind, s, tween}) => {
          if (kind === 'rect'){
            el.setAttribute('x', lerp(s.a.x, s.b.x, t));
            el.setAttribute('y', lerp(s.a.y, s.b.y, t));
            el.setAttribute('width', lerp(s.a.w, s.b.w, t));
            el.setAttribute('height', lerp(s.a.h, s.b.h, t));
          } else {
            el.setAttribute('d', tween.fn(t));
          }
        });
        cursor += w;
        if (idx < rowDef.charIds.length-1){
          const t1 = currentT[rowDef.charIds[idx+1]];
          cursor += lerp(rowDef.gapA[idx], rowDef.gapB[idx], (t+t1)/2);
        }
      });
      maxWidth = Math.max(maxWidth, cursor);
    });
    const vbH = Math.max(DATA.vbA[3], DATA.vbB[3]);
    svg.setAttribute('viewBox', `0 0 ${maxWidth} ${vbH}`);
    svg.setAttribute('width', Math.round(maxWidth * K));
    svg.setAttribute('height', Math.round(vbH * K));
  }
  renderFrame();

  let raf = null;
  function tick(){
    let allSettled = true;
    charIds.forEach(cid => {
      let v = currentT[cid] + (targetT[cid]-currentT[cid])*0.12;
      if (Math.abs(targetT[cid]-v) < 0.001) v = targetT[cid]; else allSettled = false;
      currentT[cid] = v;
    });
    renderFrame();
    raf = allSettled ? null : requestAnimationFrame(tick);
  }

  function reshuffle(){
    charIds.forEach(cid => { targetT[cid] = Math.random()<0.5?0:1; });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  document.getElementById('mixWrap').addEventListener('click', reshuffle);
})();

/* ---------------- TAB 3: random per-character position + rotation ----------------
   IMPORTANT: this never touches the morph/shape interpolation. Each character
   is drawn using its own fixed condensed shape (DATA.chars[cid].shapes 'a'
   side, static, no c<->e tween at all) laid out exactly like the rest state
   of the other tabs. A small random translate(dx,dy) + rotate(deg) is then
   applied purely as a wrapping <g transform>, entirely separate from the
   path 'd' data. Reshuffling only changes that transform, never the shape. */
(function(){
  const svg = document.getElementById('posGlyph');
  const K = 3.0; // px per unit

  // flatten row order (top-row chars then bottom-row chars, i.e. reading
  // order) into a single line -- no more top/bottom row split, which
  // sidesteps the whole "how much vertical margin" question entirely
  const charIds = [];
  DATA.rows.forEach(rowDef => charIds.push(...rowDef.charIds));

  // shape mix state (condensed=0 / extended=1 per character) -- this is the
  // ONLY thing that drives the morph/shape interpolation.
  const currentT = {}, targetT = {};
  charIds.forEach(cid => { const v = Math.random()<0.5?0:1; currentT[cid]=v; targetT[cid]=v; });

  // position/rotation jitter state -- entirely separate transform, never
  // fed into the shape tween.
  const jitterCurrent = {}, jitterTarget = {};
  function randomJitter(){
    return { dx: (Math.random()*2-1)*3.5, dy: (Math.random()*2-1)*3.5, rot: (Math.random()*2-1)*9 };
  }
  charIds.forEach(cid => { const j = randomJitter(); jitterCurrent[cid] = j; jitterTarget[cid] = j; });

  // persistent DOM: outer g (layout position + jitter translate) >
  // inner g (jitter rotation, pivot = character's own current bbox center) >
  // shape elements (driven purely by the c<->e tween, same as Random Mix)
  const charDom = {};
  charIds.forEach(cid => {
    const ch = DATA.chars[cid];
    const outerG = document.createElementNS(NS,'g');
    const innerG = document.createElementNS(NS,'g');
    outerG.appendChild(innerG);
    svg.appendChild(outerG);
    const shapeEls = ch.shapes.map(s => {
      let el;
      if (s.kind === 'rect'){ el = document.createElementNS(NS,'rect'); }
      else { el = document.createElementNS(NS,'path'); }
      if (s.fill === 'cls-1') el.setAttribute('class','cls-1');
      innerG.appendChild(el);
      const tween = s.kind === 'curve' ? makeTween(s.a.d, s.b.d) : null;
      return { el, kind: s.kind, s, tween };
    });
    charDom[cid] = { outerG, innerG, shapeEls };
  });

  const PAD = 16;
  // fixed vertical reference (computed once, not per-frame) so the glyphs'
  // vertical center stays put in the middle of the window across every
  // reshuffle, instead of the framing jumping around with the jitter
  let REF_H = 0;
  charIds.forEach(cid => {
    const ch = DATA.chars[cid];
    REF_H = Math.max(REF_H, ch.bboxA[3], ch.bboxB[3]);
  });
  const V_MARGIN = 15; // safety buffer for rotation + jitter swing

  function renderFrame(){
    let maxWidth = 0;
    // corner of a w×h rectangle (centered at origin) after rotation.
    // signX/signY pick which corner: signX=+1 right/-1 left, signY=+1
    // bottom/-1 top.
    function cornerX(w, h, rotDeg, signX, signY){
      const rad = rotDeg * Math.PI/180;
      const hw = (w/2)*signX, hh = (h/2)*signY;
      return hw*Math.cos(rad) - hh*Math.sin(rad);
    }
    function rightProtrusionAt(w, h, rotDeg, signY){
      return Math.max(0, cornerX(w,h,rotDeg,1,signY) - w/2);
    }
    function leftProtrusionAt(w, h, rotDeg, signY){
      return Math.max(0, -w/2 - cornerX(w,h,rotDeg,-1,signY));
    }
    // gap needed between two adjacent characters: check the top corners
    // and bottom corners separately, since rotation SIGN determines which
    // pair of corners actually faces the neighbor.
    function neededHorizontalGap(wL,hL,rotL, wR,hR,rotR){
      const topL = rightProtrusionAt(wL,hL,rotL,-1), topR = leftProtrusionAt(wR,hR,rotR,-1);
      const botL = rightProtrusionAt(wL,hL,rotL, 1), botR = leftProtrusionAt(wR,hR,rotR, 1);
      let top, bot;
      if (rotL * rotR < 0) {
        // opposite signs (+ next to -): apply the room to whichever one
        // side actually needs it more, not both stacked together
        top = Math.max(topL, topR);
        bot = Math.max(botL, botR);
      } else {
        top = topL + topR;
        bot = botL + botR;
      }
      let gap = Math.max(top, bot);
      // always add a little breathing room that scales with how tilted the
      // pair is, even when the corner math above says they barely need
      // any clearance
      gap += (Math.abs(rotL) + Math.abs(rotR)) * 0.12;
      return gap;
    }

    // pre-pass: current w/h/rot for every character, and a shared baseline
    // shift so every character (regardless of which original row it came
    // from, or how tall it is) sits on one common bottom line
    const info = {};
    charIds.forEach(cid => {
      const ch = DATA.chars[cid], t = currentT[cid], j = jitterCurrent[cid];
      const w = lerp(ch.bboxA[2], ch.bboxB[2], t);
      const h = lerp(ch.bboxA[3], ch.bboxB[3], t);
      const y0 = lerp(ch.bboxA[1], ch.bboxB[1], t);
      info[cid] = {
        w, h, y0,
        x0: lerp(ch.bboxA[0], ch.bboxB[0], t),
        rot: j.rot,
        baselineShift: -(y0 + h), // aligns this char's bottom edge to y=0
      };
    });

    // single-row horizontal layout
    let cursor = 0;
    charIds.forEach((cid, idx) => {
      const a = info[cid];
      a.layoutX = cursor;
      cursor += a.w;
      if (idx < charIds.length-1){
        const b = info[charIds[idx+1]];
        const extraRot = neededHorizontalGap(a.w,a.h,a.rot, b.w,b.h,b.rot);
        const heightRef = (a.h + b.h) / 2;
        // the position jitter itself can close the gap too -- if the left
        // char drifts right and/or the right char drifts left, compensate
        // for exactly that much so they still can't collide
        const jA = jitterCurrent[cid], jB = jitterCurrent[charIds[idx+1]];
        const jitterClosing = Math.max(0, jA.dx) + Math.max(0, -jB.dx);
        cursor += extraRot + heightRef*0.025 + jitterClosing;
      }
    });

    let minTop = 0, maxBottom = 0;
    charIds.forEach((cid) => {
      const t = currentT[cid];
      const { w, h, x0, y0, layoutX, baselineShift } = info[cid];
      const dx = layoutX - x0;
      const dom = charDom[cid];
      const j = jitterCurrent[cid];
      dom.outerG.setAttribute('transform', `translate(${dx + j.dx},${baselineShift + j.dy})`);
      const pivotX = x0 + w/2, pivotY = y0 + h/2;
      dom.innerG.setAttribute('transform', `rotate(${j.rot} ${pivotX} ${pivotY})`);
      dom.shapeEls.forEach(({el, kind, s, tween}) => {
        if (kind === 'rect'){
          el.setAttribute('x', lerp(s.a.x, s.b.x, t));
          el.setAttribute('y', lerp(s.a.y, s.b.y, t));
          el.setAttribute('width', lerp(s.a.w, s.b.w, t));
          el.setAttribute('height', lerp(s.a.h, s.b.h, t));
        } else {
          el.setAttribute('d', tween.fn(t));
        }
      });
      maxWidth = Math.max(maxWidth, layoutX + w);
    });
    // fixed vertical framing: baseline (y=0) sits REF_H+V_MARGIN below the
    // top and V_MARGIN above the bottom, so the glyphs' natural vertical
    // center stays anchored in the middle of the window every time,
    // instead of recentering around whatever this frame's jitter happens
    // to be
    const vbTop = -(REF_H + V_MARGIN), vbH = REF_H + 2*V_MARGIN;
    svg.setAttribute('viewBox', `${-PAD} ${vbTop} ${maxWidth+2*PAD} ${vbH}`);
    svg.setAttribute('width', Math.round((maxWidth+2*PAD)*K));
    svg.setAttribute('height', Math.round(vbH*K));
  }
  renderFrame();

  let raf = null;
  function tick(){
    let allSettled = true;
    charIds.forEach(cid => {
      let v = currentT[cid] + (targetT[cid]-currentT[cid])*0.12;
      if (Math.abs(targetT[cid]-v) < 0.001) v = targetT[cid]; else allSettled = false;
      currentT[cid] = v;

      const c = jitterCurrent[cid], t = jitterTarget[cid];
      c.dx += (t.dx-c.dx)*0.15; c.dy += (t.dy-c.dy)*0.15; c.rot += (t.rot-c.rot)*0.15;
      if (Math.abs(t.dx-c.dx)<0.01 && Math.abs(t.dy-c.dy)<0.01 && Math.abs(t.rot-c.rot)<0.05){
        c.dx=t.dx; c.dy=t.dy; c.rot=t.rot;
      } else allSettled = false;
    });
    renderFrame();
    raf = allSettled ? null : requestAnimationFrame(tick);
  }
  function reshuffle(){
    charIds.forEach(cid => {
      targetT[cid] = Math.random()<0.5?0:1;
      jitterTarget[cid] = randomJitter();
    });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  document.getElementById('posWrap').addEventListener('click', reshuffle);
})();

/* ---------------- music player + audio-reactive reshuffle ---------------- */
(function(){
  const SONGS = [
    { title: 'Pretender',  id: 'TQ8WlA2GXbk' },
    { title: 'Cry Baby',   id: 'O1bhZgkC4Gw' },
    { title: 'Mixed Nuts', id: 'EZy_vHyFedw' },
  ];

  const ytFrame = document.getElementById('ytFrame');
  function playSong(i){
    // plain src swap -- no JS API, no postMessage, so this also works when
    // the file is opened directly (file://) instead of served over http(s)
    ytFrame.src = `https://www.youtube.com/embed/${SONGS[i].id}?autoplay=1&playsinline=1`;
  }

  document.querySelectorAll('.song-btn').forEach((btn, i) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.song-btn').forEach(b => b.classList.remove('playing'));
      btn.classList.add('playing');
      playSong(i);
      if (audioReactive.ctx && audioReactive.ctx.state === 'suspended') {
        audioReactive.ctx.resume();
      }
    });
  });

  // no autoplay attempt on page load -- browsers reliably allow autoplay
  // WITH sound only after a real user gesture, and clicking a song title
  // is exactly that, so playback starts cleanly right from the first click

  /* ---- audio-reactive trigger: needs the user to share this tab's audio
     (getDisplayMedia) since there is no way to read a YouTube iframe's
     audio level directly -- browsers block cross-origin access to it. ---- */
  const audioReactive = {
    ctx: null, analyser: null, data: null, on: false, lastTrigger: 0,
  };
  const COOLDOWN_MS = 1000;
  const LEVEL_THRESHOLD = 0.18; // tune if it triggers too much/little

  function currentReshuffleTarget(){
    const tab = document.querySelector('.tab-btn.active')?.dataset.tab;
    if (tab === 'mix') return document.getElementById('mixWrap');
    if (tab === 'pos') return document.getElementById('posWrap');
    return null;
  }

  function monitorLevel(){
    if (!audioReactive.on) return;
    audioReactive.analyser.getByteTimeDomainData(audioReactive.data);
    let sum = 0;
    for (let i=0; i<audioReactive.data.length; i++){
      const v = (audioReactive.data[i]-128)/128;
      sum += v*v;
    }
    const rms = Math.sqrt(sum/audioReactive.data.length);
    const now = performance.now();
    if (rms > LEVEL_THRESHOLD && now - audioReactive.lastTrigger > COOLDOWN_MS){
      audioReactive.lastTrigger = now;
      const target = currentReshuffleTarget();
      if (target) target.click();
    }
    requestAnimationFrame(monitorLevel);
  }

  async function enableAudioReactive(){
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const audioTracks = stream.getAudioTracks();
      if (audioTracks.length === 0){
        alert('오디오 공유 체크박스를 켜야 반응형 기능을 쓸 수 있어요 (예: "탭 오디오 공유").');
        stream.getTracks().forEach(t => t.stop());
        return false;
      }
      stream.getVideoTracks().forEach(t => t.stop());
      audioReactive.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioReactive.ctx.createMediaStreamSource(stream);
      audioReactive.analyser = audioReactive.ctx.createAnalyser();
      audioReactive.analyser.fftSize = 512;
      source.connect(audioReactive.analyser);
      audioReactive.data = new Uint8Array(audioReactive.analyser.frequencyBinCount);
      audioReactive.on = true;
      // if the user stops sharing via the browser's own UI, turn back off
      audioTracks[0].addEventListener('ended', () => disableAudioReactive());
      monitorLevel();
      return true;
    } catch(err){
      console.warn('audio-reactive setup failed', err);
      return false;
    }
  }
  function disableAudioReactive(){
    audioReactive.on = false;
    if (audioReactive.ctx) { audioReactive.ctx.close(); audioReactive.ctx = null; }
    document.querySelectorAll('.audio-reactive-toggle').forEach(b => {
      b.classList.remove('on'); b.textContent = '🎧 Audio: off';
    });
  }

  document.querySelectorAll('.audio-reactive-toggle').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (audioReactive.on){
        disableAudioReactive();
        return;
      }
      btn.textContent = '🎧 requesting…';
      const ok = await enableAudioReactive();
      document.querySelectorAll('.audio-reactive-toggle').forEach(b => {
        b.classList.toggle('on', ok);
        b.textContent = ok ? '🎧 Audio: on' : '🎧 Audio: off';
      });
    });
  });
})();
